<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Solar Emerald Green to Midnight Green -->
    <linearGradient id="agBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Solar Gold Gradient: Brilliant Sunshine to Warm Amber -->
    <linearGradient id="agGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Sun Core Ambient Glow -->
    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Green Squircle Background (iOS/Android/Browser Tab Perfect) -->
  <rect width="512" height="512" rx="120" fill="url(#agBgGrad)"/>
  
  <!-- Subtle Solar Gold Ring Border -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="#FBBF24" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Glowing Sun Ambient Aura -->
  <circle cx="256" cy="256" r="115" fill="#F59E0B" opacity="0.25" filter="url(#solarGlow)"/>

  <!-- 8 Bold, High-Visibility Solar Rays (Designed for Ultra-Sharp 16px/32px Tab Visibility) -->
  <!-- Top Ray -->
  <path d="M256 52 L280 135 L232 135 Z" fill="url(#agGoldGrad)"/>
  <!-- Bottom Ray -->
  <path d="M256 460 L280 377 L232 377 Z" fill="url(#agGoldGrad)"/>
  <!-- Left Ray -->
  <path d="M52 256 L135 232 L135 280 Z" fill="url(#agGoldGrad)"/>
  <!-- Right Ray -->
  <path d="M460 256 L377 232 L377 280 Z" fill="url(#agGoldGrad)"/>

  <!-- Diagonal Rays -->
  <!-- Top-Right -->
  <path d="M400 112 L368 180 L332 144 Z" fill="url(#agGoldGrad)"/>
  <!-- Bottom-Left -->
  <path d="M112 400 L144 332 L180 368 Z" fill="url(#agGoldGrad)"/>
  <!-- Top-Left -->
  <path d="M112 112 L180 144 L144 180 Z" fill="url(#agGoldGrad)"/>
  <!-- Bottom-Right -->
  <path d="M400 400 L332 368 L368 332 Z" fill="url(#agGoldGrad)"/>

  <!-- Sun Outer Corona Ring -->
  <circle cx="256" cy="256" r="98" fill="url(#agGoldGrad)"/>

  <!-- High-Contrast Green Contrast Ring -->
  <circle cx="256" cy="256" r="74" fill="#064E3B"/>

  <!-- Sun Radiant Core (With Clean Energy Flare) -->
  <circle cx="256" cy="256" r="54" fill="url(#agGoldGrad)"/>
  <circle cx="256" cy="256" r="32" fill="#FEF08A"/>
</svg>
